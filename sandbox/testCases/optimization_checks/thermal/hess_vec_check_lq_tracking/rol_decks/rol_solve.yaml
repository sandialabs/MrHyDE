%YAML 1.1
---
ANONYMOUS:
  Analysis:
    analysis type: ROL2
    ROL2:
      General:
        Output Level: 1
        Disable source on final output: false
        Variable Objective Function: false
        Scale for Epsilon Active Sets: 1.0
        # Enable LQ operator diagnostics.
        Do grad+hessvec check: true
        Do exact hessvec check: true
        Do algebraic hessvec check: true
        Do secant identity check: true
        FD Check Seed: 3
        FD Check Random Seed: 42
        FD Check Random Scale: 1.0
        Bound Optimization Variables: false
        Inexact Objective Function: false
        Inexact Gradient: false
        Inexact Hessian-Times-A-Vector: false
        Projected Gradient Criticality Measure: false
        HessVec Precond Mode: identity
        Secant:
          Type: Limited-Memory BFGS
          Use as Preconditioner: false
          Use as Hessian: false
          Maximum Storage: 20
        Krylov:
          Type: Conjugate Gradients
          Absolute Tolerance: 1.0e-14
          Relative Tolerance: 1.0e-10
          Iteration Limit: 250
      Step:
        Type: Trust Region
        Trust Region:
          Subproblem Solver: Truncated CG
          Initial Radius: 1.0e+08
          Maximum Radius: 5.0e+18
          Step Acceptance Threshold: 5.0e-02
          Radius Shrinking Threshold: 5.0e-02
          Radius Growing Threshold: 9.0e-01
          Radius Shrinking Rate (Negative rho): 6.25e-02
          Radius Shrinking Rate (Positive rho): 2.5e-01
          Radius Growing Rate: 2.5
          Safeguard Size: 1.0e+01
          Iteration Limit: 250
      Status Test:
        Gradient Tolerance: 1.0e-8
        Use Relative Tolerances: true
        Constraint Tolerance: 1.0e-12
        Step Tolerance: 1.0e-50
        Iteration Limit: 10
...
