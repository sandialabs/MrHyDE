%YAML 1.1
---
ANONYMOUS:
  Solver:
    solver: steady-state
    Belos solver: Block GMRES
    Belos implicit residual scaling: Norm of Initial Residual
    right preconditioner: true
    nonlinear TOL: 1.0e-7
    linear TOL: 1.0e-6
    max nonlinear iters: 10
    max linear iters: 2000
    krylov vectors: 250
    use preconditioner: true
    preconditioner type: block triangular
...
