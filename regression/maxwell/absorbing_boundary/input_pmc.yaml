%YAML 1.1
---
ANONYMOUS:
  debug level: 0
  verbosity: 0
  Mesh:
    dimension: 3
    shape: hex
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 0.1
    zmin: 0.0
    zmax: 0.1
    NX: 50
    NY: 1
    NZ: 1
  Physics:
    modules: maxwell
    Initial conditions:
      'E[x]': '0.0'
      'E[y]': 'exp(-((x-0.4)/0.1)^2)'
      'E[z]': '0.0'
      'B[x]': '0.0'
      'B[y]': '0.0'
      'B[z]': '2.0*exp(-((x-0.4)/0.1)^2)'
    Dirichlet conditions:
      Ex:
        top: '0.0'
        bottom: '0.0'
      Ey:
        top: '0.0'
        bottom: '0.0'
      Ez:
        top: '0.0'
        bottom: '0.0'
  Discretization:
    order:
      E: 1
      B: 1
    quadrature: 2
    side quadrature: 2
  Functions:
    permittivity: '2.0'
    permeability: '0.5'
    refractive index: '2.0'
  Solver:
    solver: 'transient'
    transient BDF order: 1
    transient Butcher tableau: DIRK-1,2
    workset size: 100
    nonlinear TOL: 1.0e-07
    linear TOL: 1.0e-09
    max nonlinear iters: 1
    max linear iters: 200
    final time: 2.0
    number of steps: 100
    initial type: 'L2-projection'
    use direct solver: true
    strict linear solve: true
    allow backtracking: false
  Analysis:
    analysis type: forward
  Postprocess:
    write solution: false
    write frequency: 1
    compute errors: true
    True solutions:
      'E[x]': '0.0'
      'E[y]': '0.0'
      'E[z]': '0.0'
      'B[x]': '0.0'
      'B[y]': '0.0'
      'B[z]': '0.0'
...
