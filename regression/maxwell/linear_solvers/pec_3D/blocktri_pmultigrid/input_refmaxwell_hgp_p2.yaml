%YAML 1.1
---
ANONYMOUS:
  debug level: 0
  verbosity: 10
  disable timers: true

  Mesh input file: ../input_common_maxwell_hex3d.yaml
  Physics input file: ../input_common_maxwell_hex3d.yaml
  Functions input file: ../input_common_maxwell_hex3d.yaml
  Solver input file: ../input_solver_common.yaml
  Analysis input file: ../input_common_maxwell_hex3d.yaml
  Postprocess input file: ../input_common_maxwell_hex3d.yaml

  Discretization:
    eblock-0_0_0:
      order:
        E: 2
        B: 2
      quadrature: 4
      side quadrature: 4

  Solver:
    preconditioner type: block triangular
    Block Triangular Settings:
      variable groups:
        B: 'B'
        E: 'E'
      schur target: E
      approximation type: diag
      diag use lumped pivot diagonal: true
      B:
        preconditioner: AMG
        AMG Settings:
          xml param file: ../xml/amg_pivot.xml
      E:
        preconditioner: RefMaxwell
        hgrad basis name: phi_aux
        hgrad basis order: 2
        hcurl basis name: E
        hcurl basis order: 2
        RefMaxwell Settings:
          xml param file: ../xml/refmaxwell_dl015.xml
...
