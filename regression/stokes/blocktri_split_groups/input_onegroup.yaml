%YAML 1.1
---
#    M = M(input_flat.yaml)
ANONYMOUS:
  debug level: 0
  verbosity: 10
  disable timers: true
  Mesh:
    dimension: 2
    element type: quad
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    NX: 24
    NY: 24
  Physics:
    usePSPG: false
    modules: Stokes
    Dirichlet conditions:
      ux:
        bottom: '0.0'
        top: '0.0'
      uy:
        bottom: '0.0'
        top: '0.0'
  Solver:
    solver: steady-state
    Belos solver: Block GMRES
    workset size: 16
    nonlinear TOL: 1.0e-10
    linear TOL: 1.0e-10
    max nonlinear iters: 2
    max linear iters: 200
    initial type: none
    use direct solver: false
    use preconditioner: true
    preconditioner type: block triangular

    Block Triangular Settings:
      variable groups:
        ux: 'ux'
        uy: 'uy'
        pr: 'pr'
      schur target: pr
      split groups:
        all: 'ux, uy, pr'
      approximation type: diag
      ux:
        preconditioner: AMG
        AMG Settings:
          'aggregation: drop tol': 0.05
          'smoother: params':
            'chebyshev: degree': 4
            'chebyshev: ratio eigenvalue': 20.0
      uy:
        preconditioner: AMG
        AMG Settings:
          'aggregation: drop tol': 0.05
          'smoother: params':
            'chebyshev: degree': 4
            'chebyshev: ratio eigenvalue': 20.0
      pr:
        preconditioner: AMG
  Discretization:
    order:
      ux: 2
      uy: 2
      pr: 1
    quadrature: 4
  Analysis:
    analysis type: forward
  Postprocess:
    compute errors: true
    True solutions:
      ux: '0.5*y*(1.0-y)'
      uy: '0.0'
      pr: '0.0'
  Functions:
    source ux: '1.0'
...
