%YAML 1.1
---
ANONYMOUS:
  debug level: 0
  verbosity: 10
  disable timers: true
  Mesh:
    dimension: 2
    element type: quad
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    NX: 4
    NY: 4
  Physics:
    usePSPG: true    # nonzero pressure diagonal, so Jacobi is defined on all three blocks
    modules: Stokes
    Dirichlet conditions:
      ux:
        bottom: '0.0'
        top: '0.0'
      uy:
        bottom: '0.0'
        top: '0.0'
  Solver:
    solver: steady-state
    workset size: 16
    nonlinear TOL: 1.0e-10
    linear TOL: 1.0e-10
    max nonlinear iters: 2
    initial type: none
    use direct solver: false
    use preconditioner: true
    preconditioner type: block diagonal
    Block 0 Settings:
      preconditioner variant: RELAXATION
      'relaxation: type': Jacobi
      'relaxation: sweeps': 1
      'relaxation: damping factor': 0.66
    Block 1 Settings:
      preconditioner variant: RELAXATION
      'relaxation: type': Jacobi
      'relaxation: sweeps': 1
      'relaxation: damping factor': 0.66
    Block 2 Settings:
      preconditioner variant: RELAXATION
      'relaxation: type': Jacobi
      'relaxation: sweeps': 1
      'relaxation: damping factor': 0.66
  Discretization:
    order:
      ux: 1
      uy: 1
      pr: 1
    quadrature: 2
  Analysis:
    analysis type: forward
  Postprocess:
    compute errors: true
    True solutions:
      ux: '0.5*y*(1.0-y)'
      uy: '0.0'
      pr: '0.0'
  Functions:
    source ux: '1.0'
...
